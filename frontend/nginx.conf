server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;
    server_tokens off;

    # OJO (nginx): add_header NO se hereda en un `location` que define sus propios
    # add_header. Por eso las cabeceras de seguridad se repiten dentro de `location /`
    # y `location /assets/`; si solo estuvieran aquí, se perderían en esas páginas.
    # Content-Security-Policy: la app es un SPA que no carga nada externo (fuentes
    # self-hosted, sin CDN), así que 'self' estricto es seguro. style-src permite
    # 'unsafe-inline' porque el bundle inyecta estilos en línea.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy $csp always;

    # Resolver de Docker: el nombre "api" se resuelve en cada petición, así un redeploy
    # del contenedor (IP nueva) no deja a nginx apuntando a la IP vieja (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
    }
}
